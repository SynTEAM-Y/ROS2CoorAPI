controller_manager:
  ros__parameters:
    update_rate: 200

    # --- Controller types ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# --- Controller details ---

arm_group_controller:
  ros__parameters:
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      arm_joint1: { trajectory: 0.1, goal: 0.05 }
      arm_joint2: { trajectory: 0.1, goal: 0.05 }
      arm_joint3: { trajectory: 0.1, goal: 0.05 }
      arm_joint4: { trajectory: 0.1, goal: 0.05 }
      arm_joint5: { trajectory: 0.1, goal: 0.05 }

gripper_group_controller:
  ros__parameters:
    joints:
      - grip_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    # Optional: tighten tolerances if you need crisp closes
    constraints:
      goal_time: 1.0
      grip_joint: { trajectory: 0.05, goal: 0.02 }
